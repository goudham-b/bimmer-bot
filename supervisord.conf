[supervisord]
nodaemon=true

[program:api]
directory=/app/api
command=uv run uvicorn main:app --app-dir src --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webapp]
directory=/app/webapp
command=npm run dev -- --host 0.0.0.0 --port 5173
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
